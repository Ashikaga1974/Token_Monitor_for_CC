<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3a895"/>
      <stop offset="100%" stop-color="#d6917b"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shieldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Base (Brand #e3a895) -->
  <rect width="64" height="64" rx="16" fill="url(#shieldBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#shieldBorder)" stroke-width="1.5"/>

  <g filter="url(#shieldGlow)">
    <!-- Outer Shield Crest (Centered at 32, 32) -->
    <path d="M32 10.5 L49.5 18.5 V33 C49.5 43.5 42.5 50.5 32 53.5 C21.5 50.5 14.5 43.5 14.5 33 V18.5 Z" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Heartbeat / EKG Pulse Line -->
    <path d="M18 32.5 H23.5 L25.5 30 L27.5 32.5 L29 35.5 L32 18.5 L35 43 L37.5 32.5 L39.5 28.5 L41.5 32.5 H46" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>